<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site de Corrigir texto</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet">

</head>
<body>

    <button class="btn-tema">
        <svg class="sun-and-moon" aria-hidden="true" width="24" height="24" viewBox="0 0 24 24">
            <circle class="sun" cx="12" cy="12" r="6" mask="url(#moon-mask)" fill="currentColor" />
            <g class="sun-beams" stroke="currentColor">
                <line x1="12" y1="1" x2="12" y2="3" />
                <line x1="12" y1="21" x2="12" y2="23" />
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
                <line x1="1" y1="12" x2="3" y2="12" />
                <line x1="21" y1="12" x2="23" y2="12" />
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
            </g>
            
            <mask id="moon-mask">
                <rect x="0" y="0" width="100%" height="100%" fill="white" />
                <circle cx="24" cy="10" r="6" fill="black" class="moon" />
            </mask>
        </svg>
    </button>
            

    <a href="https://github.com/solamdev/site-de-corrigir-texto">
        <button btn-github>
            <img class="github" src="https://cdn-icons-png.flaticon.com/512/25/25231.png" alt="Github" >
        </button>
    </a>
    <form class="form" >
        <div class="box-btn">
            <button class="btn-informal" type="button">Informal</button>
            <button class="btn-equilibrado active" type="button">Equilibrado</button>
            <button class="btn-formal" type="button">Formal</button>   
        </div>
        <div class="box">
            <div class="boxinput">
                <label >Seu Texto:</label>
                <textarea name="input" class="input" placeholder="Digite Seu Texto Aqui!!!"></textarea>
                <button title="não há nada para corrigir"  class="btn-action " type="submit" disabled >Corrigir</button>
                <button  title="colar seu texto" class="btn-colar" type="button"><img class="colar" src="https://cdn-icons-png.flaticon.com/512/6583/6583091.png" alt="colar"></button>
            </div>
    
            <div class="boxOutput">
                <label >Texto Corrigido:</label>
                <textarea name="output" class="output" placeholder="Seu Texto Corrigido Aqui "></textarea>
                <button title="não há nada para copiar"  type="button" disabled class="btn-copy"><img class="copy" src="https://img.freepik.com/vetores-premium/copiar-vetor-de-icone_535345-5918.jpg" alt="copiar"></button>
                <div class="loader hidden">
                    <span>.</span>
                    <span>.</span>
                    <span>.</span>
                </div>
            </div>
        </div>
    </form>


    <div class="copiado hidden">
      <p >Texto copiado</p>
      <img src="img/icone de certinho.png" alt="icone-ok">
    </div>
<script src="index.js" ></script>
    
</body>
</html>
